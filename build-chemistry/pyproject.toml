[project]
name = "build-chemistry"
version = "0.1.0"
description = "Generate playful builder personality cards from public GitHub stars."
requires-python = ">=3.11"
dependencies = [
    "fulcra-api>=0.1.40",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.62.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["build_chemistry", "app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
markers = [
    "live_github: bounded test against the real public GitHub API",
    "live_fulcra: bounded test against real private Fulcra Context data",
]

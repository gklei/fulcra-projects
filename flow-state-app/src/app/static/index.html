<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow State</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .log-area::-webkit-scrollbar { width: 6px; }
        .log-area::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body class="bg-black text-white font-sans antialiased">

    <!-- Navbar -->
    <nav class="border-b border-zinc-800 bg-black sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="/static/assets/fulcra_logo.png" alt="Fulcra Logo" class="h-6 w-6 rounded-md">
                <a href="/" class="font-bold text-xl tracking-tight text-[#e2e8f0]">Flow State</a>
            </div>
            <div class="flex gap-6 text-sm font-medium text-zinc-400">
                <a href="/" class="text-white">App</a>
                <a href="/static/about.html" class="hover:text-white transition-colors">How it Works</a>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto mt-10 px-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column: Recording Controls -->
        <div class="lg:col-span-1 space-y-4 lg:space-y-6">
            <div class="mb-4 lg:mb-0 text-center lg:text-left">
                <h1 class="text-3xl font-bold mb-1 lg:mb-2">Flow State</h1>
                <p class="text-zinc-400 text-sm">Capture ideas without breaking your flow.</p>
            </div>

            <div class="bg-black rounded-xl shadow-xl border border-zinc-800 overflow-hidden">
                <div class="flex border-b border-zinc-800 bg-zinc-900">
                <button id="modeSession" class="flex-1 p-3 lg:p-4 text-center font-bold text-sm text-white border-b-2 border-rose-600 focus:outline-none transition-colors" onclick="setMode('session')">Session</button>
                <button id="modeMarker" class="flex-1 p-3 lg:p-4 text-center font-bold text-sm text-zinc-500 border-b-2 border-transparent hover:text-zinc-300 focus:outline-none transition-colors" onclick="setMode('marker')">Marker</button>
            </div>
            <div class="p-4 lg:p-6 bg-zinc-950 border-b border-zinc-800">

                <div class="flex justify-center items-center py-4 lg:py-6 h-24 lg:h-32">
                    <button id="startBtn" class="text-rose-600 hover:text-rose-500 transition-all duration-200 transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center focus:outline-none">
                        <span id="startIcon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-20 h-20 lg:w-24 lg:h-24 drop-shadow-[0_0_15px_rgba(225,29,72,0.4)]"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="7" fill="currentColor" stroke="none" /></svg></span>
                    </button>
                    
                    <button id="stopBtn" class="hidden text-zinc-400 hover:text-white transition-all duration-200 transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-20 h-20 lg:w-24 lg:h-24 drop-shadow-md"><path fill-rule="evenodd" d="M6 6a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H8a2 2 0 01-2-2V6z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
                
                <div class="mt-4 lg:mt-6 border-t border-zinc-800 pt-4">
                    <p id="statusText" class="font-mono text-[11px] lg:text-sm text-zinc-300 mb-2 truncate">Status: Ready.</p>
                    <div id="logArea" class="log-area font-mono text-[10px] lg:text-xs text-zinc-500 h-24 lg:h-32 overflow-y-auto space-y-1"></div>
                </div>
            </div>
                </div>

                <!-- Current Marker Accordion -->
                <div class="bg-zinc-900 border-t border-zinc-800">
                    <button class="w-full p-4 lg:p-4 text-left hover:bg-zinc-800/50 transition-colors flex justify-between items-center focus:outline-none" onclick="document.getElementById('marker-content').classList.toggle('hidden')">
                        <div>
                            <span class="font-semibold text-zinc-300 block text-sm lg:text-base">Current Marker</span>
                            <span id="markerSubtitle" class="hidden text-[10px] font-mono text-zinc-500 mt-1"></span>
                        </div>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 text-zinc-500"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" /></svg>
                    </button>
                    <div id="marker-content" class="hidden p-4 lg:p-6 border-t border-zinc-800 bg-black">
                        <div id="waveform-marker" class="mb-4 cursor-pointer"></div>
                        <div class="flex items-center gap-4">
                            <button id="playBtn-marker" class="bg-zinc-100 text-black px-4 py-1.5 rounded-full font-semibold hover:bg-white transition-colors text-[10px] lg:text-xs flex items-center justify-center gap-1 w-20">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" /></svg> Play
                            </button>
                            <span id="time-marker" class="text-zinc-500 font-mono text-[10px] lg:text-xs flex items-center gap-2">
                                <svg class="animate-spin h-3 w-3 text-zinc-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                Loading...
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Review Feed -->
        <div class="lg:col-span-2">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Review Ideas</h2>
                <button onclick="loadIdeas()" class="text-sm text-zinc-400 hover:text-white transition-colors">↻ Refresh</button>
            </div>
            
            <div id="ideasFeed" class="space-y-6">
                <!-- Dynamically populated from /api/ideas -->
                <p class="text-zinc-500 text-sm">Loading ideas from Fulcra...</p>
            </div>
        </div>
    </div>

    <script>
        // --- Recording Logic ---
        let mediaRecorder;
        let ws;
        let chunkCount = 0;
        let currentMode = "session";

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const logArea = document.getElementById('logArea');
        const modeSession = document.getElementById('modeSession');
        const modeMarker = document.getElementById('modeMarker');
        const ideasFeed = document.getElementById('ideasFeed');

        function setMode(mode) {
            currentMode = mode;
            if (mode === 'session') {
                modeSession.className = 'flex-1 py-2 rounded-md text-sm font-semibold bg-zinc-800 text-white';
                modeMarker.className = 'flex-1 py-2 rounded-md text-sm font-semibold text-zinc-500 hover:text-white';
                log("Switched to Session recording mode.");
            } else {
                modeMarker.className = 'flex-1 py-2 rounded-md text-sm font-semibold bg-zinc-800 text-white';
                modeSession.className = 'flex-1 py-2 rounded-md text-sm font-semibold text-zinc-500 hover:text-white';
                log("Switched to Marker recording mode.");
            }
        }

        function log(msg, type='info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            let color = 'text-zinc-500';
            if (type === 'success') color = 'text-green-400';
            if (type === 'error') color = 'text-rose-500';
            if (type === 'warning') color = 'text-yellow-400';
            
            div.className = color;
            div.innerText = `[${time}] ${msg}`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        startBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });
                
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(`${protocol}//${window.location.host}/ws?mode=${currentMode}`);
                chunkCount = 0;
                logArea.innerHTML = ''; 
                
                ws.onopen = () => {
                    log("WebSocket connected.", "success");
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    
                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0 && ws.readyState === WebSocket.OPEN) {
                            ws.send(event.data);
                            chunkCount++;
                            log(`Sent chunk #${chunkCount} (${(event.data.size / 1024).toFixed(1)} KB)`);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        if (ws.readyState === WebSocket.OPEN) {
                            log("Recording stopped. Finalizing...", "warning");
                            ws.send("STOP");
                        }
                    };

                    ws.onmessage = (event) => {
                        if (event.data.includes("⏳")) {
                            log(event.data, "warning");
                            statusText.innerText = "Processing Audio & Extracting Ideas...";
                        } else if (event.data.includes("✅")) {
                            log(event.data, "success");
                            statusText.innerText = "Status: Ready.";
                            ws.close();
                            // Refresh feed automatically after DSP!
                            if (currentMode === 'session') loadIdeas();
                        } else {
                            log("Backend: " + event.data, event.data.includes("❌") ? "error" : "info");
                            if (event.data.includes("❌")) ws.close();
                        }
                    }

                    mediaRecorder.start(2000);
                    startBtn.classList.add('hidden');
                    stopBtn.classList.remove('hidden');
                    statusText.innerText = `🔴 Recording ${currentMode}...`;
                    log("Started recording.");
                };

            } catch (err) {
                log("Mic error: " + err.message, "error");
            }
        };

        stopBtn.onclick = () => {
            if(mediaRecorder) mediaRecorder.stop();
            stopBtn.classList.add('hidden');
            startBtn.classList.remove('hidden');
            statusText.innerText = "Status: Uploading to Fulcra...";
        };

        // --- Playback & Feed Logic ---
        const formatTime = (time) => [Math.floor((time % 3600) / 60), ('00' + Math.floor(time % 60)).slice(-2)].join(':');
        
        // Keep track of active wavesurfers to destroy old ones on refresh
        let activeSurfers = [];

        async function loadIdeas() {
            try {
                // Clear old surfers to avoid memory leaks
                activeSurfers.forEach(ws => ws.destroy());
                activeSurfers = [];
                ideasFeed.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-12 border border-zinc-800 border-dashed rounded-xl bg-black/50">
                        <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-zinc-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <p class="text-zinc-500 text-sm font-mono tracking-widest uppercase">Fetching ideas...</p>
                    </div>
                `;
                
                const res = await fetch('/api/ideas');
                const ideas = await res.json();
                
                if (ideas.error) throw new Error(ideas.error);
                if (ideas.length === 0) {
                    ideasFeed.innerHTML = '<p class="text-zinc-500 text-sm border border-dashed border-zinc-800 p-8 rounded-xl text-center">No ideas recorded yet. Play your marker during a session to capture one!</p>';
                    return;
                }
                
                ideasFeed.innerHTML = '';
                
                // Group by source_file
                const groups = {};
                ideas.forEach(idea => {
                    const source = idea.source_file || 'Unknown_Session';
                    if (!groups[source]) groups[source] = [];
                    groups[source].push(idea);
                });
                
                Object.entries(groups).forEach(([source, groupIdeas], gIndex) => {
                    const sourceId = source.replace(/[^a-zA-Z0-9]/g, '-');
                    const groupEl = document.createElement('div');
                    groupEl.className = 'bg-black border border-zinc-800 rounded-xl overflow-hidden mb-8 shadow-xl';
                    
                    // Parse the date from the first idea in the group
                    let sessionDate = `<span class="text-zinc-100">Unknown</span> <span class="text-zinc-300">Date</span>`;
                    let sessionLength = "";
                    if (groupIdeas.length > 0) {
                        if (groupIdeas[0].recorded_at) {
                            const d = new Date(groupIdeas[0].recorded_at);
                            const weekday = d.toLocaleDateString('en-US', { weekday: 'long' });
                            const monthDay = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                            const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                            
                            // Cascading colors: White -> Light Gray -> Medium Gray
                            sessionDate = `<span class="text-zinc-50">${weekday},</span> <span class="text-zinc-50">${monthDay}</span> <span class="text-zinc-400 text-sm ml-1">${time}</span>`;
                        }
                        
                        // We can calculate total session length if we have the highest start_time from the ideas
                        // (Rough estimate since we don't fetch the exact duration of the source file yet,
                        // but it gives a good approximation based on when the last idea was played)
                        const maxStartTime = Math.max(...groupIdeas.map(i => i.start_time || 0));
                        if (maxStartTime > 0) {
                            const minutes = Math.floor(maxStartTime / 60);
                            const seconds = maxStartTime % 60;
                            sessionLength = `<span class="text-zinc-700 mx-2">|</span>${minutes}m ${seconds}s`;
                        }
                    }
                    
                    let html = `
                        <button class="w-full p-4 bg-zinc-900 border-b border-zinc-800 flex justify-between items-center text-left hover:bg-zinc-800/50 transition-colors focus:outline-none" onclick="document.getElementById('group-content-${sourceId}').classList.toggle('hidden')">
                            <div>
                                <h3 class="font-bold text-lg">${sessionDate}</h3>
                                <p class="text-xs font-mono text-zinc-500 mt-1">${source}${sessionLength}</p>
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="px-3 py-1 bg-zinc-800 rounded-full text-xs text-zinc-400 border border-zinc-700">${groupIdeas.length} idea${groupIdeas.length > 1 ? 's' : ''} extracted</span>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 text-zinc-500"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" /></svg>
                            </div>
                        </button>
                        <div id="group-content-${sourceId}" class="block">
                            <div class="p-4 pl-6 pr-4 space-y-4 bg-zinc-950 border-b border-zinc-800">
                    `;
                    
                    groupIdeas.forEach((idea, iIndex) => {
                        let title = idea.file_path ? idea.file_path.split('/').pop().replace('.wav', '') : `Idea ${iIndex + 1}`;
                        
                        // D3 Cool (Cyan to Magenta) for bright neon colors that pop on dark backgrounds
                        const t = groupIdeas.length > 1 ? iIndex / (groupIdeas.length - 1) : 0.5;
                        idea.color = d3.interpolateCool(t);
                        
                        html += `
                            <div class="bg-zinc-900 rounded-xl p-4 shadow-sm border-x border-b border-zinc-800 hover:border-zinc-700 transition-colors" style="border-top: 4px solid ${idea.color};">
                                <div class="flex flex-wrap items-center justify-between mb-4 gap-y-2">
                                    <div class="w-full min-w-0 pr-4 sm:w-auto">
                                        <h4 class="text-md font-semibold text-zinc-200 truncate">${title}</h4>
                                    </div>
                                    <div class="flex gap-2 w-full sm:w-auto shrink-0 justify-start sm:justify-end">
                                        ${idea.key ? `<span class="px-2 py-1 bg-zinc-800 rounded-full text-[10px] text-zinc-300 font-mono">Key: ${idea.key}</span>` : ''}
                                        ${idea.bpm ? `<span class="px-2 py-1 bg-zinc-800 rounded-full text-[10px] text-zinc-300 font-mono">BPM: ${idea.bpm}</span>` : ''}
                                    </div>
                                </div>
                                <div id="waveform-${idea.id}" class="mb-4 cursor-pointer"></div>
                                <div class="flex items-center gap-4">
                                    <button id="playBtn-${idea.id}" class="bg-zinc-100 text-black px-4 py-1.5 rounded-full font-semibold hover:bg-white transition-colors text-xs flex items-center justify-center gap-1 w-20">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" /></svg> Play
                                    </button>
                                    <span id="time-${idea.id}" class="text-zinc-500 font-mono text-xs flex items-center gap-2">
                                        <svg class="animate-spin h-3 w-3 text-zinc-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                        Loading...
                                    </span>
                                </div>
                            </div>
                        `;
                    });
                    
                    html += `</div>`; // Close inset ideas area
                    
                    // Accordion for Source Audio
                    html += `
                        <div class="bg-zinc-900">
                            <button class="w-full p-4 text-left font-semibold text-zinc-300 hover:text-white transition-colors flex justify-between items-center focus:outline-none" onclick="document.getElementById('source-content-${sourceId}').classList.toggle('hidden')">
                                <span>Full Session Audio</span>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 text-zinc-500"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" /></svg>
                            </button>
                            <div id="source-content-${sourceId}" class="hidden p-6 border-t border-zinc-800 bg-black">
                                <div id="waveform-source-${sourceId}" class="mb-4 cursor-pointer"></div>
                                <div class="flex items-center gap-4">
                                    <button id="playBtn-source-${sourceId}" class="bg-zinc-800 text-white px-4 py-1.5 rounded-full font-semibold hover:bg-zinc-700 border border-zinc-700 transition-colors text-xs flex items-center justify-center gap-1 w-20">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" /></svg> Play
                                    </button>
                                    <span id="time-source-${sourceId}" class="text-zinc-500 font-mono text-xs flex items-center gap-2">
                                        <svg class="animate-spin h-3 w-3 text-zinc-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                        Loading source...
                                    </span>
                                </div>
                            </div>
                        </div>
                        </div> <!-- Close group-content -->
                    `;
                    
                    groupEl.innerHTML = html;
                    ideasFeed.appendChild(groupEl);
                    
                    // Initialize Wavesurfers
                    
                    // 1. Idea surfers
                    groupIdeas.forEach(idea => {
                        const audioUrl = idea.file_path ? `/api/audio?path=${encodeURIComponent(idea.file_path)}` : 'https://wavesurfer.xyz/wavesurfer-code/examples/audio/audio.wav';
                        const surfer = WaveSurfer.create({
                            container: `#waveform-${idea.id}`,
                            waveColor: '#4f4f4f',
                            progressColor: '#e11d48', // rose-600 to match pill
                            cursorColor: '#ffffff',
                            barWidth: 2,
                            barGap: 2,
                            barRadius: 2,
                            height: 50,
                            url: audioUrl
                        });
                        
                        let isReady = false;
                        const playBtn = document.getElementById(`playBtn-${idea.id}`);
                        const timeDisplay = document.getElementById(`time-${idea.id}`);
                        
                        surfer.on('ready', () => { isReady = true; timeDisplay.textContent = `0:00 / ${formatTime(surfer.getDuration())}`; });
                        surfer.on('finish', () => playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" /></svg> Play');
                        surfer.on('audioprocess', () => { timeDisplay.textContent = `${formatTime(surfer.getCurrentTime())} / ${formatTime(surfer.getDuration())}`; });
                        surfer.on('interaction', () => {
                            if (isReady) {
                               timeDisplay.textContent = `${formatTime(surfer.getCurrentTime())} / ${formatTime(surfer.getDuration())}`;
                               if (!surfer.isPlaying()) { 
                                   playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M5.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75A.75.75 0 007.25 3h-1.5zM12.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75a.75.75 0 00-.75-.75h-1.5z" /></svg> Pause'; 
                                   surfer.play(); 
                               }
                            }
                        });
                        playBtn.addEventListener('click', () => {
                            if (!isReady) return;
                            if (surfer.isPlaying()) { 
                                surfer.pause(); 
                                playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" /></svg> Play'; 
                            } else { 
                                surfer.play(); 
                                playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M5.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75A.75.75 0 007.25 3h-1.5zM12.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75a.75.75 0 00-.75-.75h-1.5z" /></svg> Pause'; 
                            }
                        });
                        activeSurfers.push(surfer);
                    });
                    
                    // 2. Source Surfer
                    const sourceAudioUrl = `/api/audio?path=${encodeURIComponent('/agent/flow-state/sessions/raw/' + source)}`;
                    const wsRegions = WaveSurfer.Regions.create();
                    
                    const sourceSurfer = WaveSurfer.create({
                        container: `#waveform-source-${sourceId}`,
                        waveColor: '#3f3f46',
                        progressColor: '#71717a',
                        cursorColor: '#ffffff',
                        barWidth: 2,
                        barGap: 2,
                        barRadius: 2,
                        height: 80,
                        url: sourceAudioUrl,
                        plugins: [wsRegions]
                    });
                    
                    let sourceIsReady = false;
                    const sourcePlayBtn = document.getElementById(`playBtn-source-${sourceId}`);
                    const sourceTimeDisplay = document.getElementById(`time-source-${sourceId}`);
                    
                    sourceSurfer.on('ready', () => {
                        sourceIsReady = true;
                        sourceTimeDisplay.textContent = `0:00 / ${formatTime(sourceSurfer.getDuration())}`;
                        
                        // Add regions for each idea
                        groupIdeas.forEach(idea => {
                            if (idea.start_time !== undefined && idea.start_time > 0) {
                                wsRegions.addRegion({
                                    start: Math.max(0, idea.start_time - 30), // 30-second lookback window
                                    end: idea.start_time, // Marker is at the very end
                                    color: idea.color.replace('rgb', 'rgba').replace(')', ', 0.25)'),
                                    drag: false,
                                    resize: false
                                });
                            }
                        });
                    });
                    
                    sourceSurfer.on('finish', () => sourcePlayBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" /></svg> Play');
                    sourceSurfer.on('audioprocess', () => { sourceTimeDisplay.textContent = `${formatTime(sourceSurfer.getCurrentTime())} / ${formatTime(sourceSurfer.getDuration())}`; });
                    sourceSurfer.on('interaction', () => {
                        if (sourceIsReady) {
                           sourceTimeDisplay.textContent = `${formatTime(sourceSurfer.getCurrentTime())} / ${formatTime(sourceSurfer.getDuration())}`;
                           if (!sourceSurfer.isPlaying()) { 
                               sourcePlayBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M5.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75A.75.75 0 007.25 3h-1.5zM12.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75a.75.75 0 00-.75-.75h-1.5z" /></svg> Pause'; 
                               sourceSurfer.play(); 
                           }
                        }
                    });
                    sourcePlayBtn.addEventListener('click', () => {
                        if (!sourceIsReady) return;
                        if (sourceSurfer.isPlaying()) { 
                            sourceSurfer.pause(); 
                            sourcePlayBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" /></svg> Play'; 
                        } else { 
                            sourceSurfer.play(); 
                            sourcePlayBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M5.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75A.75.75 0 007.25 3h-1.5zM12.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75a.75.75 0 00-.75-.75h-1.5z" /></svg> Pause'; 
                        }
                    });
                    activeSurfers.push(sourceSurfer);
                });
                
            } catch (err) {
                ideasFeed.innerHTML = `<p class="text-rose-500 text-sm">Error loading ideas: ${err.message}</p>`;
            }
        }
        
        // Initial load
        window.addEventListener('DOMContentLoaded', () => { loadIdeas(); loadMarker(); });

        async function loadMarker() {
            try {
                const res = await fetch('/api/marker');
                const data = await res.json();
                const timeDisplay = document.getElementById('time-marker');
                const playBtn = document.getElementById('playBtn-marker');
                
                if (data.error || !data.file_path) {
                    timeDisplay.innerHTML = 'No marker found.';
                    return;
                }
                        
                        // Parse timestamp from stat metadata if available, fallback to filename parsing
                        let markerDateStr = "Unknown Date";
                        if (data.created_at) {
                            const d = new Date(data.created_at);
                            const dateOpts = { weekday: 'short', month: 'short', day: 'numeric' };
                            const timeOpts = { hour: 'numeric', minute: '2-digit' };
                            markerDateStr = `${d.toLocaleDateString('en-US', dateOpts)} ${d.toLocaleTimeString('en-US', timeOpts)}`;
                        } else {
                            const match = data.file_path.match(/marker_(\\d{4})(\\d{2})(\\d{2})_(\\d{2})(\\d{2})(\\d{2})/);
                            if (match) {
                                const [_, yr, mo, da, hr, mn, sc] = match;
                                const d = new Date(Date.UTC(yr, mo-1, da, hr, mn, sc));
                                const dateOpts = { weekday: 'short', month: 'short', day: 'numeric' };
                                const timeOpts = { hour: 'numeric', minute: '2-digit' };
                                markerDateStr = `${d.toLocaleDateString('en-US', dateOpts)} ${d.toLocaleTimeString('en-US', timeOpts)}`;
                            }
                        }
                        
                // Inject into subtitle
                const markerSub = document.getElementById('markerSubtitle');
                if (markerSub) {
                    markerSub.textContent = `captured: ${markerDateStr}`;
                    markerSub.classList.remove('hidden');
                }
                        
                const audioUrl = `/api/audio?path=${encodeURIComponent(data.file_path)}`;
                const markerSurfer = WaveSurfer.create({
                    container: '#waveform-marker',
                    waveColor: '#4f4f4f',
                    progressColor: '#20d8ba', // teal/cyan
                    cursorColor: '#ffffff',
                    barWidth: 2,
                    barGap: 2,
                    barRadius: 2,
                    height: 50,
                    url: audioUrl
                });
                
                let isReady = false;
                markerSurfer.on('ready', () => {
                    isReady = true;
                    timeDisplay.textContent = `0:00 / ${formatTime(markerSurfer.getDuration())}`;
                });
                markerSurfer.on('finish', () => playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" /></svg> Play');
                markerSurfer.on('audioprocess', () => { timeDisplay.textContent = `${formatTime(markerSurfer.getCurrentTime())} / ${formatTime(markerSurfer.getDuration())}`; });
                markerSurfer.on('interaction', () => {
                    if (isReady) {
                       timeDisplay.textContent = `${formatTime(markerSurfer.getCurrentTime())} / ${formatTime(markerSurfer.getDuration())}`;
                       if (!markerSurfer.isPlaying()) { 
                           playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M5.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75A.75.75 0 007.25 3h-1.5zM12.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75a.75.75 0 00-.75-.75h-1.5z" /></svg> Pause'; 
                           markerSurfer.play(); 
                       }
                    }
                });
                playBtn.addEventListener('click', () => {
                    if (!isReady) return;
                    if (markerSurfer.isPlaying()) { 
                        markerSurfer.pause(); 
                        playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" /></svg> Play'; 
                    } else { 
                        markerSurfer.play(); 
                        playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3"><path d="M5.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75A.75.75 0 007.25 3h-1.5zM12.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75a.75.75 0 00-.75-.75h-1.5z" /></svg> Pause'; 
                    }
                });
            } catch (err) {
                console.error(err);
            }
        }

    </script>
